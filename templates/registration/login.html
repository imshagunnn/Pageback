{% extends "web/base.html" %}
{% block title %}Sign in — PageBack{% endblock %}
{% block content %}
<section class="auth">
    <h1>Sign in</h1>
    <p class="lede">Continue the book you already started.</p>
    <form method="post" action="{% url 'login' %}" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn primary">Sign in</button>
    </form>
    <p class="note">New here? <a href="{% url 'signup' %}">Create an account</a>. You can also <a href="{% url 'demo' %}">try the demo</a> without signing in.</p>
</section>
{% endblock %}
